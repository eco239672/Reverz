<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverz — pôdorys piatich miestností</title>
  <style>
    :root { --page: #ffffff; --ink: #252825; --muted: #f0f2f0; --secondary: #68706a; --line: #4d554e; --zoom: 1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; height: 100vh; overflow: hidden; background: var(--page); color: var(--ink); font-family: Arial, sans-serif; }
    main { width: min(100%, 980px); height: 100vh; margin: 0 auto; padding: 16px 24px; display: flex; flex-direction: column; overflow: hidden; }
    .view-switch { position: fixed; top: 30mm; left: 10mm; z-index: 1; display: flex; flex: 0 0 auto; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0; }
    .view-button { appearance: none; border: 1px solid #c5cac5; border-radius: 6px; background: #ffffff; color: var(--ink); padding: 8px 14px; font: 500 15px Arial, sans-serif; }
    .view-button[aria-pressed="true"] { background: #4d554e; border-color: #4d554e; color: #ffffff; }
    .view-switch > .view-button, .room-a-control > .view-button { width: 140px; text-align: center; }
    .room-a-control, .switch-control { position: relative; }
    .menu-options { position: absolute; top: 0; left: calc(100% + 8px); z-index: 2; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .menu-options[hidden] { display: none; }
    .menu-options.is-open { pointer-events: auto; }
    .menu-options > .menu-item { opacity: 0; transform: translateX(-14px); transition: opacity 420ms ease, transform 420ms ease; }
    .menu-options > .menu-item:nth-child(n + 2) { transform: translateY(-18px); }
    .menu-options.is-open > .menu-item { opacity: 1; transform: translate(0, 0); }
    .menu-options.is-open > .menu-item:nth-child(2) { transition-delay: 440ms; }
    .menu-options.is-open > .menu-item:nth-child(3) { transition-delay: 660ms; }
    .room-a-options > .menu-item > .view-button { width: 84px; text-align: center; }
    .switch-options, .socket-options, .wire-options { display: grid; grid-auto-flow: column; grid-auto-columns: max-content; column-gap: 8px; row-gap: 0; }
    .switch-options > .menu-item:nth-child(n + 2), .socket-options > .menu-item:nth-child(n + 2), .wire-options > .menu-item:nth-child(n + 2) { transform: translateX(-14px); }
    .switch-options.is-open > .menu-item:nth-child(n + 2), .socket-options.is-open > .menu-item:nth-child(n + 2), .wire-options.is-open > .menu-item:nth-child(n + 2) { transform: translate(0, 0); }
    .view-panel { flex: 1 1 auto; min-height: 0; }
    .view-panel:not([hidden]) { display: flex; }
    .drawing { display: flex; width: 100%; height: 100%; align-items: stretch; justify-content: center; overflow: hidden; }
    svg { display: block; width: auto; height: 100%; max-width: 100%; margin: auto; transform: scale(var(--zoom)); transform-origin: center; }
    #three-d-view { flex-direction: column; gap: 8px; overflow: hidden; }
    .orientation-controls { display: flex; flex: 0 0 auto; justify-content: center; gap: 8px; }
    .orientation-button { appearance: none; border: 1px solid #c5cac5; border-radius: 6px; background: #ffffff; color: var(--ink); padding: 6px 12px; font: 500 14px Arial, sans-serif; }
    .orientation-button[aria-pressed="true"] { background: #4d554e; border-color: #4d554e; color: #ffffff; }
    #three-d-view svg { flex: 1 1 auto; min-height: 0; width: auto; height: auto; cursor: grab; touch-action: none; }
    #three-d-view svg:active { cursor: grabbing; }
    #three-d-view svg.move-mode { cursor: move; }
    #three-d-view svg.move-mode:active { cursor: grabbing; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-width: 480px) {
      main { padding: 12px; }
      #three-d-view svg {
        width: calc(100vw - 170px);
        max-width: calc(100vw - 170px);
        margin-left: auto;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Reverz — pôdorys piatich miestností</h1>
    <span id="zoom-status" class="sr-only" aria-live="polite"></span>
    <div class="view-switch" role="group" aria-label="Zobrazenie výkresu">
      <button class="view-button" id="top-button" type="button" aria-pressed="true">Floor plan</button>
      <button class="view-button" id="three-d-button" type="button" data-model="house" aria-pressed="false">House 3d</button>
      <div class="room-a-control">
        <button class="view-button" id="room-a-button" type="button" data-model="a" aria-pressed="false" aria-expanded="false" aria-controls="room-a-options">Room A</button>
        <div class="room-a-options menu-options" id="room-a-options" hidden>
          <div class="menu-item switch-control">
            <button class="view-button" id="switch-button" type="button" aria-pressed="false" aria-expanded="false" aria-controls="switch-options">Switch</button>
            <div class="switch-options menu-options" id="switch-options" hidden>
              <div class="menu-item"><button class="view-button" type="button" data-switch-variant aria-pressed="false">A</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-switch-variant aria-pressed="false">B</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-switch-variant aria-pressed="false">C</button></div>
            </div>
          </div>
          <div class="menu-item socket-control">
            <button class="view-button" id="socket-button" type="button" aria-pressed="false" aria-expanded="false" aria-controls="socket-options">Socket</button>
            <div class="socket-options menu-options" id="socket-options" hidden>
              <div class="menu-item"><button class="view-button" type="button" data-socket-variant aria-pressed="false">A</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-socket-variant aria-pressed="false">B</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-socket-variant aria-pressed="false">C</button></div>
            </div>
          </div>
          <div class="menu-item wire-control">
            <button class="view-button" id="wire-button" type="button" aria-pressed="false" aria-expanded="false" aria-controls="wire-options">Wire</button>
            <div class="wire-options menu-options" id="wire-options" hidden>
              <div class="menu-item"><button class="view-button" type="button" data-wire-variant aria-pressed="false">A</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-wire-variant aria-pressed="false">B</button></div>
              <div class="menu-item"><button class="view-button" type="button" data-wire-variant aria-pressed="false">C</button></div>
            </div>
          </div>
        </div>
      </div>
      <button class="view-button" type="button" data-model="b" aria-pressed="false">Room B</button>
      <button class="view-button" type="button" data-model="c" aria-pressed="false">Room C</button>
      <button class="view-button" type="button" data-model="d" aria-pressed="false">Room D</button>
      <button class="view-button" type="button" data-model="e" aria-pressed="false">Room E</button>
    </div>
    <section class="view-panel" id="top-view" aria-label="Pohľad zhora">
    <div class="drawing">

line x1="630" y1="500" x2="640" y2="500" stroke="currentColor" stroke-width="0.75" /><line x1="467" y1="600" x2="543" y2="600" stroke="currentColor" /><line x1="467" y1="610" x2="543" y2="610" stroke="currentColor" /><line x1="467" y1="600" x2="467" y2="610" stroke="currentColor" /><line x1="543" y1="600" x2="543" y2="610" stroke="currentColor" /><line x1="505" y1="600" x2="505" y2="610" stroke="currentColor" stroke-width="0.75" />

          <g fill="currentColor" text-anchor="middle" font-family="Arial, sans-serif">

          </g>
          <g stroke="currentColor" stroke-width="0.75">
            <line x1="120" y1="72" x2="120" y2="93" /><line x1="370" y1="72" x2="370" y2="93" /><line x1="380" y1="72" x2="380" y2="93" /><line x1="630" y1="72" x2="630" y2="93" /><line x1="77" y1="100" x2="113" y2="100" /><line x1="77" y1="390" x2="113" y2="390" /><line x1="77" y1="400" x2="113" y2="400" /><line x1="77" y1="600" x2="113" y2="600" /><line x1="120" y1="617" x2="120" y2="642" /><line x1="370" y1="617" x2="370" y2="642" /><line x1="380" y1="617" x2="380" y2="642" /><line x1="630" y1="617" x2="630" y2="642" />
          </g>
          <g fill="currentColor" text-anchor="middle" font-family="Arial, sans-serif" font-size="16"><text x="245" y="57">5 m</text><text x="505" y="57">5 m</text><text x="45" y="250">6 m</text><text x="45" y="503">4 m</text><text x="245" y="641">5 m</text><text x="505" y="641">5 m</text></g>
          <g fill="var(--ink)" font-family="Arial, sans-serif" font-size="15">
            <text x="375" y="30" text-anchor="middle">Back</text>
            <text x="375" y="682" text-anchor="middle">Front</text>
            <text x="22" y="350" text-anchor="middle">Left</text>
            <text x="690" y="350" text-anchor="middle">Right</text>
          </g>

    </div>
    </section>
    <section class="view-panel" id="three-d-view" aria-label="Trojrozmerný pohľad" hidden>
      <div class="orientation-controls" role="group" aria-label="Pohľad na model">
        <button class="orientation-button" type="button" data-yaw="-45" data-pitch="30" aria-pressed="true">3D</button>
        <button class="orientation-button" type="button" data-yaw="0" data-pitch="0" aria-pressed="false">Front</button>
        <button class="orientation-button" type="button" data-yaw="-90" data-pitch="0" aria-pressed="false">Left</button>
        <button class="orientation-button" type="button" data-yaw="90" data-pitch="0" aria-pressed="false">Right</button>
        <button class="orientation-button" type="button" data-yaw="180" data-pitch="0" aria-pressed="false">Back</button>
        <button class="orientation-button move-button" id="move-button" type="button" aria-pressed="false">Move</button>
      </div>
      <svg viewBox="0 0 820 680" role="img" aria-labelledby="three-d-title three-d-desc">
        <title id="three-d-title">Trojrozmerný pohľad na päť prepojených miestností</title>
        <desc id="three-d-desc">Axonometrický model so zhodnými súradnicami ako pôdorys; tlačidlá Front, Left, Right a Back zobrazia kolmý pohľad na príslušnú obvodovú stenu.</desc>
        <g id="three-d-drawing"></g>
      </svg>
    </section>
  </main>
  <script>
    const topButton = document.getElementById('top-button');
    const modelButtons = [...document.querySelectorAll('[data-model]')];
    const roomAButton = document.getElementById('room-a-button');
    const roomAOptions = document.getElementById('room-a-options');
    const switchButton = document.getElementById('switch-button');
    const switchOptions = document.getElementById('switch-options');
    const switchVariantButtons = [...document.querySelectorAll('[data-switch-variant]')];
    const socketButton = document.getElementById('socket-button');
    const socketOptions = document.getElementById('socket-options');
    const socketVariantButtons = [...document.querySelectorAll('[data-socket-variant]')];
    const wireButton = document.getElementById('wire-button');
    const wireOptions = document.getElementById('wire-options');
    const wireVariantButtons = [...document.querySelectorAll('[data-wire-variant]')];
    const topView = document.getElementById('top-view');
    const threeDView = document.getElementById('three-d-view');
    let selectedModel = 'house';
    const closeSwitchOptions = () => {
      switchOptions.classList.remove('is-open');
      switchOptions.hidden = true;
      switchButton.setAttribute('aria-pressed', 'false');
      switchButton.setAttribute('aria-expanded', 'false');
      switchVariantButtons.forEach(button => button.setAttribute('aria-pressed', 'false'));
    };
    const openSwitchOptions = () => {
      switchOptions.hidden = false;
      switchOptions.classList.remove('is-open');
      requestAnimationFrame(() => requestAnimationFrame(() => switchOptions.classList.add('is-open')));
      switchButton.setAttribute('aria-pressed', 'true');
      switchButton.setAttribute('aria-expanded', 'true');
    };
    const closeSocketOptions = () => {
      socketOptions.classList.remove('is-open');
      socketOptions.hidden = true;
      socketButton.setAttribute('aria-pressed', 'false');
      socketButton.setAttribute('aria-expanded', 'false');
      socketVariantButtons.forEach(button => button.setAttribute('aria-pressed', 'false'));
    };
    const openSocketOptions = () => {
      socketOptions.hidden = false;
      socketOptions.classList.remove('is-open');
      requestAnimationFrame(() => requestAnimationFrame(() => socketOptions.classList.add('is-open')));
      socketButton.setAttribute('aria-pressed', 'true');
      socketButton.setAttribute('aria-expanded', 'true');
    };
    const closeWireOptions = () => {
      wireOptions.classList.remove('is-open');
      wireOptions.hidden = true;
      wireButton.setAttribute('aria-pressed', 'false');
      wireButton.setAttribute('aria-expanded', 'false');
      wireVariantButtons.forEach(button => button.setAttribute('aria-pressed', 'false'));
    };
    const openWireOptions = () => {
      wireOptions.hidden = false;
      wireOptions.classList.remove('is-open');
      requestAnimationFrame(() => requestAnimationFrame(() => wireOptions.classList.add('is-open')));
      wireButton.setAttribute('aria-pressed', 'true');
      wireButton.setAttribute('aria-expanded', 'true');
    };
    const closeRoomAOptions = () => {
      closeSwitchOptions();
      closeSocketOptions();
      closeWireOptions();
      roomAOptions.classList.remove('is-open');
      roomAOptions.hidden = true;
      roomAButton.setAttribute('aria-expanded', 'false');
    };
    const openRoomAOptions = () => {
      closeSwitchOptions();
      closeSocketOptions();
      closeWireOptions();
      roomAOptions.hidden = false;
      roomAOptions.classList.remove('is-open');
      // Restart the sequence whenever Room A is selected.
      requestAnimationFrame(() => requestAnimationFrame(() => roomAOptions.classList.add('is-open')));
      roomAButton.setAttribute('aria-expanded', 'true');
    };
    const showView = (showThreeD) => {
      topView.hidden = showThreeD;
      threeDView.hidden = !showThreeD;
      topButton.setAttribute('aria-pressed', String(!showThreeD));
      if (!showThreeD) {
        modelButtons.forEach(button => button.setAttribute('aria-pressed', 'false'));
        closeRoomAOptions();
      }
    };
    topButton.addEventListener('click', () => showView(false));
    switchButton.addEventListener('click', () => {
      closeSocketOptions();
      closeWireOptions();
      openSwitchOptions();
    });
    switchVariantButtons.forEach(button => button.addEventListener('click', () => {
      switchVariantButtons.forEach(variant => variant.setAttribute('aria-pressed', String(variant === button)));
    }));
    socketButton.addEventListener('click', () => {
      closeSwitchOptions();
      closeWireOptions();
      openSocketOptions();
    });
    socketVariantButtons.forEach(button => button.addEventListener('click', () => {
      socketVariantButtons.forEach(variant => variant.setAttribute('aria-pressed', String(variant === button)));
    }));
    wireButton.addEventListener('click', () => {
      closeSwitchOptions();
      closeSocketOptions();
      openWireOptions();
    });
    wireVariantButtons.forEach(button => button.addEventListener('click', () => {
      wireVariantButtons.forEach(variant => variant.setAttribute('aria-pressed', String(variant === button)));
    }));
    document.addEventListener('pointerdown', event => {
      if (!event.target.closest('.view-switch')) closeRoomAOptions();
    });
    modelButtons.forEach(button => button.addEventListener('click', () => {
      selectedModel = button.dataset.model;
      showView(true);
      modelButtons.forEach(modelButton => modelButton.setAttribute('aria-pressed', String(modelButton === button)));
      const isRoomA = button === roomAButton;
      if (isRoomA) openRoomAOptions();
      else closeRoomAOptions();
      render3d();
    }));

    let zoom = 1;
    const zoomStatus = document.getElementById('zoom-status');
    const setZoom = (nextZoom) => {
      zoom = Math.max(.5, Math.min(2.5, nextZoom));
      document.documentElement.style.setProperty('--zoom', zoom);
      zoomStatus.textContent = `Mierka pohľadu: ${Math.round(zoom * 100)} %`;
    };
    window.addEventListener('keydown', (event) => {
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      const zoomIn = event.key === '+' || event.key === '=' || event.code === 'NumpadAdd';
      const zoomOut = event.key === '-' || event.key === '_' || event.code === 'NumpadSubtract';
      if (!zoomIn && !zoomOut) return;
      event.preventDefault();
      setZoom(zoom + (zoomIn ? .1 : -.1));
    });

    // Všetky body sú v metroch a zdieľajú súradnicový systém s 2D pôdorysom.
    const drawing3d = document.getElementById('three-d-drawing');
    const svgNs = 'http://www.w3.org/2000/svg';
    let yaw = -45;
    let pitch = 30;
    let roll = 0;
    let directElevation = null;
    const modelBounds = {
      house: { minX: 0, maxX: 10, minY: 0, maxY: 10 },
      a: { minX: 0, maxX: 5, minY: 6, maxY: 10 },
      b: { minX: 0, maxX: 5, minY: 0, maxY: 6 },
      c: { minX: 5, maxX: 10, minY: 0, maxY: 3 },
      d: { minX: 5, maxX: 10, minY: 3, maxY: 6 },
      e: { minX: 5, maxX: 10, minY: 6, maxY: 10 },
    };
    const modelOffsets = Object.fromEntries(Object.keys(modelBounds).map(model => [model, { x: 0, y: 0 }]));
    const project = ([x, y, z = 0]) => {
      const radians = yaw * Math.PI / 180;
      const tilt = pitch * Math.PI / 180;
      const bounds = modelBounds[selectedModel];
      const centerX = x - (bounds.minX + bounds.maxX) / 2;
      const centerY = y - (bounds.minY + bounds.maxY) / 2;
      const rotatedX = centerX * Math.cos(radians) - centerY * Math.sin(radians);
      const depth = centerX * Math.sin(radians) + centerY * Math.cos(radians);
      const planeX = rotatedX * 38;
      // Výška stien je v obraze konštantná; náklon ovplyvňuje len hĺbku pôdorysu.
      const planeY = depth * 19 * Math.sin(tilt) - z * 120;
      const rollRadians = roll * Math.PI / 180;
      const offset = modelOffsets[selectedModel];
      return [
        410 + offset.x + planeX * Math.cos(rollRadians) - planeY * Math.sin(rollRadians),
        355 + offset.y + planeX * Math.sin(rollRadians) + planeY * Math.cos(rollRadians),
      ];
    };
    const svg = (name, attributes = {}, parent = drawing3d) => {
      const element = document.createElementNS(svgNs, name);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      parent.append(element);
      return element;
    };
    const polygon = (points, attributes = {}, parent) => svg('polygon', {
      points: points.map(project).map(([x, y]) => `${x},${y}`).join(' '),
      ...attributes,
    }, parent);
    const line = (from, to, attributes = {}, parent) => {
      const [x1, y1] = project(from); const [x2, y2] = project(to);
      return svg('line', { x1, y1, x2, y2, ...attributes }, parent);
    };
    let edgeQueue = [];
    let wallFaces = [];
    const viewDepth = ([x, y]) => {
      const radians = yaw * Math.PI / 180;
      const bounds = modelBounds[selectedModel];
      return (x - (bounds.minX + bounds.maxX) / 2) * Math.sin(radians) + (y - (bounds.minY + bounds.maxY) / 2) * Math.cos(radians);
    };
    const pointInside = (point, polygonPoints) => {
      let direction = 0;
      for (let index = 0; index < polygonPoints.length; index += 1) {
        const start = polygonPoints[index];
        const end = polygonPoints[(index + 1) % polygonPoints.length];
        const cross = (end[0] - start[0]) * (point[1] - start[1]) - (end[1] - start[1]) * (point[0] - start[0]);
        if (Math.abs(cross) < .2) return false;
        const nextDirection = Math.sign(cross);
        if (direction && direction !== nextDirection) return false;
        direction = nextDirection;
      }
      return true;
    };
    const isInteriorSide = ([x, y]) => {
      if (directElevation !== null) return false;
      const radians = yaw * Math.PI / 180;
      if (x === 0) return Math.sin(radians) > 0;
      if (x === 10) return Math.sin(radians) < 0;
      if (y === 0) return Math.cos(radians) > 0;
      if (y === 10) return Math.cos(radians) < 0;
      return true;
    };
    const queueEdge = (from, to, attributes, owner) => edgeQueue.push({ from, to, attributes, owner });
    const drawVisibleEdge = ({ from, to, attributes, owner }) => {
      const steps = 72;
      const pointAt = (fraction) => from.map((value, index) => value + (to[index] - value) * fraction);
      const visibleAt = (fraction) => {
        const point = pointAt(fraction);
        const projected = project(point);
        const pointDepth = viewDepth(point);
        return !wallFaces.some((face) => face.owner !== owner
          && pointInside(projected, face.projected)
          && face.depth > pointDepth + .001);
      };
      let start = null;
      for (let index = 0; index <= steps; index += 1) {
        const fraction = index / steps;
        if (visibleAt(fraction)) {
          if (start === null) start = fraction;
        } else if (start !== null) {
          line(pointAt(start), pointAt((index - 1) / steps), attributes);
          start = null;
        }
      }
      if (start !== null) line(pointAt(start), pointAt(1), attributes);
    };
    const wall = (from, to, bottom = 0, top = 1, { startEdge = true, endEdge = true, owner } = {}) => {
      const points = [[...from, bottom], [...to, bottom], [...to, top], [...from, top]];
      polygon(points, { fill: 'var(--page)', stroke: 'none' });
      wallFaces.push({
        owner,
        projected: points.map(project),
        depth: viewDepth([(from[0] + to[0]) / 2, (from[1] + to[1]) / 2]),
      });
      const edgeStyle = { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' };
      queueEdge([...from, bottom], [...to, bottom], edgeStyle, owner);
      queueEdge([...from, top], [...to, top], edgeStyle, owner);
      if (startEdge === true || (startEdge === 'inside' && isInteriorSide(from))) queueEdge([...from, bottom], [...from, top], edgeStyle, owner);
      if (endEdge === true || (endEdge === 'inside' && isInteriorSide(to))) queueEdge([...to, bottom], [...to, top], edgeStyle, owner);
    };
    const room = (name, dimensions, points) => {
      polygon(points, { fill: 'none', stroke: 'var(--line)', 'stroke-width': 1 });
    };
    const labelRoom = (name, dimensions, points) => {
      const center = points.reduce((sum, [x, y]) => [sum[0] + x, sum[1] + y], [0, 0]).map(value => value / points.length);
      const [x, y] = project(center);
      const label = svg('text', { x, y: y + 1, fill: 'var(--ink)', 'font-family': 'Arial, sans-serif', 'font-size': 19, 'text-anchor': 'middle' });
      label.textContent = name;
      const size = svg('text', { x, y: y + 22, fill: 'var(--secondary)', 'font-family': 'Arial, sans-serif', 'font-size': 14, 'text-anchor': 'middle' });
      size.textContent = dimensions;
    };
    const opening = (from, to, kind, options = {}, owner) => {
      const edgeStyle = { stroke: 'var(--line)', 'stroke-width': 1, 'stroke-linejoin': 'round' };
      const bottom = kind === 'window' ? .28 : kind === 'vent' ? .6 : 0;
      const top = kind === 'window' ? .76 : kind === 'vent' ? .8 : kind === 'sliding' ? .8 : .88;
      const addSegment = (segmentFrom, segmentTo) => queueEdge(segmentFrom, segmentTo, edgeStyle, owner);
      if (kind === 'window' || kind === 'vent') {
        addSegment([...from, bottom], [...to, bottom]);
        addSegment([...to, bottom], [...to, top]);
        addSegment([...to, top], [...from, top]);
        addSegment([...from, top], [...from, bottom]);
        const midpoint = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
        addSegment([...midpoint, bottom], [...midpoint, top]);
      } else {
        addSegment([...from, bottom], [...to, bottom]);
        addSegment([...from, top], [...to, top]);
        addSegment([...from, bottom], [...from, top]);
        addSegment([...to, bottom], [...to, top]);
        if (kind === 'sliding') {
          const midpoint = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
          addSegment([...midpoint, bottom], [...midpoint, top]);
        }
      }
    };
    const render3d = () => {
      drawing3d.replaceChildren();
      edgeQueue = [];
      wallFaces = [];
      const bounds = modelBounds[selectedModel];
      // Súradnice sú zhodné s pôdorysom: y = 10 je Front (spodná hrana),
      // y = 0 je Back, x = 0 je Left a x = 10 je Right.
      if (directElevation === null) {
        polygon([[bounds.minX, bounds.minY], [bounds.maxX, bounds.minY], [bounds.maxX, bounds.maxY], [bounds.minX, bounds.maxY]], { fill: 'var(--page)', stroke: 'var(--line)', 'stroke-width': 1 });
      }
      const walls = [
        { from: [0, 0], to: [.5, 0], endEdge: false }, { from: [.5, 0], to: [4.5, 0], startEdge: false, endEdge: false, slidingDoors: [[[.5, 0], [4.5, 0]]] }, { from: [4.5, 0], to: [5, 0], startEdge: false, endEdge: false },
        { from: [5, 0], to: [6.7, 0], startEdge: false, endEdge: false }, { from: [6.7, 0], to: [8.3, 0], startEdge: false, endEdge: false, windows: [[[6.7, 0], [8.3, 0]]] }, { from: [8.3, 0], to: [10, 0], startEdge: false },
        { from: [10, 0], to: [10, .7], endEdge: false }, { from: [10, .7], to: [10, 2.3], startEdge: false, endEdge: false, windows: [[[10, .7], [10, 2.3]]] }, { from: [10, 2.3], to: [10, 3], startEdge: false, endEdge: false }, { from: [10, 3], to: [10, 4], startEdge: false, endEdge: false }, { from: [10, 4], to: [10, 5], startEdge: false, endEdge: false, vents: [[[10, 4], [10, 5]]] }, { from: [10, 5], to: [10, 6], startEdge: false, endEdge: false },
        { from: [10, 6], to: [10, 7.2], startEdge: false, endEdge: false }, { from: [10, 7.2], to: [10, 8.8], startEdge: false, endEdge: false, windows: [[[10, 7.2], [10, 8.8]]] }, { from: [10, 8.8], to: [10, 10], startEdge: false },
        { from: [0, 10], to: [5, 10], endEdge: false, doors: [[[2, 10], [3, 10]]] },
        { from: [5, 10], to: [6.7, 10], startEdge: false, endEdge: false }, { from: [6.7, 10], to: [8.3, 10], startEdge: false, endEdge: false, windows: [[[6.7, 10], [8.3, 10]]] }, { from: [8.3, 10], to: [10, 10], startEdge: false },
        { from: [0, 0], to: [0, .9333], endEdge: false },
        { from: [0, .9333], to: [0, 2.5333], startEdge: false, endEdge: false, windows: [[[0, .9333], [0, 2.5333]]] },
        { from: [0, 2.5333], to: [0, 3], startEdge: false, endEdge: false },
        { from: [0, 3], to: [0, 3.4667], startEdge: false, endEdge: false },
        { from: [0, 3.4667], to: [0, 5.0667], startEdge: false, endEdge: false, windows: [[[0, 3.4667], [0, 5.0667]]] },
        { from: [0, 5.0667], to: [0, 6], startEdge: false, endEdge: false },
        { from: [0, 6], to: [0, 7.2], startEdge: false, endEdge: false }, { from: [0, 7.2], to: [0, 8.8], startEdge: false, endEdge: false, windows: [[[0, 7.2], [0, 8.8]]] },
        { from: [0, 8.8], to: [0, 10], startEdge: false },
        // Hlavná stena v osi 5 m je rozdelená priečkami na tri samostatné úseky.
        // Vďaka tomu sa každý úsek pri otáčaní zoradí podľa vlastnej hĺbky.
        { from: [5, 0], to: [5, 3], startEdge: 'inside', endEdge: true, doors: [[[5, 2], [5, 2.8]]] },
        { from: [5, 3], to: [5, 6], startEdge: true, endEdge: true, doors: [[[5, 4.6], [5, 5.4]]] },
        { from: [5, 6], to: [5, 10], startEdge: true, endEdge: 'inside', doors: [[[5, 7.6], [5, 8.4], { showToEdge: () => Math.sin(yaw * Math.PI / 180) > 0 }]] },
        { from: [5, 3], to: [10, 3], startEdge: true, endEdge: 'inside', doors: [[[7, 3], [8, 3]]] },
        { from: [0, 6], to: [5, 6], startEdge: 'inside', endEdge: true, doors: [[[2, 6], [3, 6], { showToEdge: () => Math.cos(yaw * Math.PI / 180) < 0 }]] },
        { from: [5, 6], to: [10, 6], startEdge: true, endEdge: 'inside', doors: [[[7, 6], [8, 6]]] },
      ].map((wallDefinition, index) => ({ ...wallDefinition, owner: index }));
      const belongsToSelectedModel = ({ from, to }) => {
        if (selectedModel === 'house') return true;
        const between = (value, minimum, maximum) => value >= minimum && value <= maximum;
        const horizontalFacade = from[1] === to[1]
          && (from[1] === bounds.minY || from[1] === bounds.maxY)
          && between(from[0], bounds.minX, bounds.maxX)
          && between(to[0], bounds.minX, bounds.maxX);
        const verticalFacade = from[0] === to[0]
          && (from[0] === bounds.minX || from[0] === bounds.maxX)
          && between(from[1], bounds.minY, bounds.maxY)
          && between(to[1], bounds.minY, bounds.maxY);
        return horizontalFacade || verticalFacade;
      };
      const depth = ({ from, to }) => {
        const radians = yaw * Math.PI / 180;
        return ((from[0] + to[0]) / 2 - (bounds.minX + bounds.maxX) / 2) * Math.sin(radians) + ((from[1] + to[1]) / 2 - (bounds.minY + bounds.maxY) / 2) * Math.cos(radians);
      };
      // Najvzdialenejšie steny sa kreslia najprv. Neviditeľná biela plocha ich
      // prekryje, takže po otočení zostanú len línie, ktoré nie sú za stenou.
      const modelWalls = walls.filter(belongsToSelectedModel).sort((a, b) => depth(a) - depth(b));
      const isOnSelectedFacade = ({ from, to }) => {
        if (directElevation === 0) return from[1] === bounds.maxY && to[1] === bounds.maxY; // Front
        if (directElevation === 180) return from[1] === bounds.minY && to[1] === bounds.minY; // Back
        if (directElevation === -90) return from[0] === bounds.minX && to[0] === bounds.minX; // Left
        if (directElevation === 90) return from[0] === bounds.maxX && to[0] === bounds.maxX; // Right
        return true;
      };
      const visibleWalls = directElevation === null ? modelWalls : modelWalls.filter(isOnSelectedFacade);
      visibleWalls.forEach(({ from, to, doors = [], slidingDoors = [], windows = [], vents = [], startEdge, endEdge, owner }) => {
        wall(from, to, 0, 1, { startEdge, endEdge, owner });
        doors.forEach(([doorFrom, doorTo, options]) => opening(doorFrom, doorTo, 'door', options, owner));
        slidingDoors.forEach(([doorFrom, doorTo]) => opening(doorFrom, doorTo, 'sliding', {}, owner));
        windows.forEach(([windowFrom, windowTo]) => opening(windowFrom, windowTo, 'window', {}, owner));
        vents.forEach(([ventFrom, ventTo]) => opening(ventFrom, ventTo, 'vent', {}, owner));
      });
      edgeQueue.forEach(drawVisibleEdge);
      if (selectedModel === 'a' && directElevation === null) {
        const outlineStyle = { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' };
        const roomACorners = [[0, 6], [5, 6], [5, 10], [0, 10]];
        const shouldShowOutlineCorner = (corner) => {
          const projectedX = project([...corner, 0])[0];
          const allProjectedX = roomACorners.map(candidate => project([...candidate, 0])[0]);
          const isSilhouette = Math.abs(projectedX - Math.min(...allProjectedX)) < .01
            || Math.abs(projectedX - Math.max(...allProjectedX)) < .01;
          if (!isSilhouette) return false;
          const closestAtSameX = roomACorners
            .filter(candidate => Math.abs(project([...candidate, 0])[0] - projectedX) < .01)
            .map(viewDepth);
          return viewDepth(corner) >= Math.max(...closestAtSameX) - .001;
        };
        [[0, 6], [5, 10]].forEach((corner) => {
          if (shouldShowOutlineCorner(corner)) line([...corner, 0], [...corner, 1], outlineStyle);
        });
      }
      if (selectedModel === 'a' && directElevation === 0) {
        line([5, 10, 0], [5, 10, 1], { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
      }
      if (selectedModel === 'a' && directElevation === -90) {
        line([0, 6, 0], [0, 6, 1], { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
      }
      if (selectedModel === 'a' && directElevation === 90) {
        line([5, 10, 0], [5, 10, 1], { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
      }
      if (selectedModel === 'a' && directElevation === 180) {
        line([0, 6, 0], [0, 6, 1], { stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round' });
      }
      // Pri kolmých pohľadoch na B až E vždy uzavri oba konce zobrazenej steny.
      // Spoje pri vnútorných priečkach by ich inak potlačili.
      if (['b', 'c', 'd', 'e'].includes(selectedModel) && directElevation !== null) {
        const facadeEnds = directElevation === 0 ? [[bounds.minX, bounds.maxY], [bounds.maxX, bounds.maxY]]
          : directElevation === 180 ? [[bounds.minX, bounds.minY], [bounds.maxX, bounds.minY]]
          : directElevation === -90 ? [[bounds.minX, bounds.minY], [bounds.minX, bounds.maxY]]
          : [[bounds.maxX, bounds.minY], [bounds.maxX, bounds.maxY]];
        facadeEnds.forEach(([x, y]) => line([x, y, 0], [x, y, 1], {
          stroke: 'var(--line)', 'stroke-width': 1.1, 'stroke-linejoin': 'round',
        }));
      }

    };
    render3d();

    const threeDSvg = drawing3d.closest('svg');
    const orientationButtons = [...document.querySelectorAll('.orientation-button[data-yaw]')];
    const moveButton = document.getElementById('move-button');
    let moveMode = false;
    const clearOrientationSelection = () => orientationButtons.forEach(button => button.setAttribute('aria-pressed', 'false'));
    const setMoveMode = (isActive) => {
      moveMode = isActive;
      moveButton.setAttribute('aria-pressed', String(moveMode));
      threeDSvg.classList.toggle('move-mode', moveMode);
    };
    const setOrientation = (nextYaw, nextPitch, selectedButton) => {
      setMoveMode(false);
      yaw = nextYaw;
      pitch = nextPitch;
      roll = 0;
      directElevation = nextPitch === 0 ? nextYaw : null;
      clearOrientationSelection();
      selectedButton.setAttribute('aria-pressed', 'true');
      render3d();
    };
    let dragStart = null;
    threeDSvg.addEventListener('pointerdown', (event) => {
      dragStart = { x: event.clientX, y: event.clientY };
      threeDSvg.setPointerCapture(event.pointerId);
    });
    threeDSvg.addEventListener('pointermove', (event) => {
      if (!dragStart) return;
      const moveX = event.clientX - dragStart.x;
      const moveY = event.clientY - dragStart.y;
      if (moveMode) {
        const rect = threeDSvg.getBoundingClientRect();
        const offset = modelOffsets[selectedModel];
        offset.x += moveX * 820 / rect.width;
        offset.y += moveY * 680 / rect.height;
      } else {
        clearOrientationSelection();
        if (event.shiftKey) {
          roll += moveX * .5;
        } else {
          yaw += moveX * .5;
          pitch = Math.max(-70, Math.min(70, pitch - moveY * .25));
        }
        directElevation = null;
      }
      dragStart = { x: event.clientX, y: event.clientY };
      render3d();
    });
    const stopRotation = (event) => {
      dragStart = null;
      if (threeDSvg.hasPointerCapture(event.pointerId)) threeDSvg.releasePointerCapture(event.pointerId);
    };
    threeDSvg.addEventListener('pointerup', stopRotation);
    threeDSvg.addEventListener('pointercancel', stopRotation);
    moveButton.addEventListener('click', () => {
      clearOrientationSelection();
      setMoveMode(!moveMode);
    });
    // Front je spodná hrana pôdorysu. Smerové pohľady majú pitch 0 (kolmý pohľad),
    // voľba 3D obnoví axonometrický náhľad.
    orientationButtons.forEach(button => button.addEventListener('click', () => setOrientation(Number(button.dataset.yaw), Number(button.dataset.pitch), button)));
  </script>
</body>
</html>
